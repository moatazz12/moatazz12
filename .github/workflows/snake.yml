name: Generate Snake Animation

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: moatazz12
          outputs: |
            dist/github-snake.svg?color_snake=#0891b2&color_dots=#ebedf0,#cffafe,#67e8f9,#06b6d4,#0e7490
            dist/github-snake-dark.svg?color_snake=#00ffff&color_dots=#161b22,#083344,#0891b2,#06b6d4,#00ffff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to output branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: output
          folder: dist
          token: ${{ secrets.GITHUB_TOKEN }}

